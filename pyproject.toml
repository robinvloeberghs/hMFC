[build-system]
requires = ["setuptools >= 30.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmfc"
dynamic = ["version"]
requires-python = ">= 3.10"
dependencies = [
    "jax>=0.3.15",
    "jaxlib",
    "fastprogress",
    "tensorflow_probability",
    "scikit-learn",
    "jaxtyping",
    "typing-extensions",
    "numpy<2.0"
]

authors = [
    {name="Robin Vloeberghs"}, 
    {name="Anne E. Urai"}, 
    {name="Kobe Desender"}, 
    {name="Scott W. Linderman"}, 
]
maintainers = [
    {name="Robin Vloeberghs", email="robin.vloeberghs@kuleuven.be"},
    {name="Scott Linderman", email="scott.linderman@stanford.edu"}
]
description = "Hierarchical Model for Fluctuations in Criterion."
readme = "README.md"
license = {file="LICENSE"}
classifiers = ["Programming Language :: Python"]

[project.urls]
repository = "https://github.com/robinvloeberghs/hMFC"

[tool.setuptools.packages.find]
exclude = ["Demo", "Paper"] 
